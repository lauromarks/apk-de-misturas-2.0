name: Gerar APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - name: Aplicar ícone VJET e splash branca
        run: |
          find android/app/src/main/res -path '*mipmap-*' -name 'ic_launcher*' -delete
          cp -r android-res/. android/app/src/main/res/
          find android/app/src/main/res -name 'splash.png' -exec cp android-res/drawable/splash.png {} \;
      - run: npx cap sync android
      - name: Compilar APK (debug, instalável direto)
        run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: calculadora-misturas-vjet-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
